name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://sevenbet:sevenbet@127.0.0.1:54329/sevenbet_ci
  DIRECT_URL: postgresql://sevenbet:sevenbet@127.0.0.1:54329/sevenbet_ci
  BETTER_AUTH_SECRET: ci-only-better-auth-sentinel-do-not-use
  BETTER_AUTH_URL: http://127.0.0.1:4173
  BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:4173
  SEVENBET_ADMIN_PREVIEW_TOKEN: ci-only-admin-preview-sentinel-do-not-use
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4173
  PUBLIC_CASINO_CMS_ENABLED: "false"
  AFFILIATE_REDIRECT_ENGINE_ENABLED: "false"
  ALLOW_TEMPORARY_PRODUCTION_DEMO_CASINOS: "false"

jobs:
  agent-core:
    name: Agent Core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents
    env:
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agents/package-lock.json
      - run: npm ci
      - run: npm run check

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:quality
      - name: Observe date-sensitive Programme regression suite
        continue-on-error: true
        run: npm run programme:test

  build-browser:
    name: Build / Browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sevenbet
          POSTGRES_PASSWORD: sevenbet
          POSTGRES_DB: sevenbet_ci
        ports:
          - 54329:5432
        options: >-
          --health-cmd="pg_isready -U sevenbet -d sevenbet_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:migrations
      - run: npm run mvp-runtime:postgres-test
      - run: npm run programme:seed
      - run: npm run build
      - run: npm run ci:build-secrets
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:browser

  database-migrations:
    name: Database / Migration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sevenbet
          POSTGRES_PASSWORD: sevenbet
          POSTGRES_DB: sevenbet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sevenbet -d sevenbet_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
      DIRECT_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:migrations
      - run: npm run mvp-runtime:postgres-test
