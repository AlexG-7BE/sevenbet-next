name: RFC031 one-time test manifest patch

on:
  push:
    branches:
      - rfc-031-voice-upload-limit

permissions:
  contents: write

jobs:
  patch-test-manifest:
    if: contains(github.event.head_commit.message, '[apply-rfc031-test-manifest]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rfc-031-voice-upload-limit
          fetch-depth: 0
      - name: Add RFC-031 unit test to Programme manifests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('package.json')
          text = path.read_text()
          old = 'tests/program-ai-openai-adapters.test.ts tests/program-ai-structural.test.ts'
          new = 'tests/program-ai-openai-adapters.test.ts tests/program-ai-transcription-request.test.ts tests/program-ai-structural.test.ts'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 Programme test manifest matches, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- package.json
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git rm .github/workflows/rfc031-one-time-test-manifest-patch.yml
          git commit -m "test: include RFC-031 request bounds in Programme suite"
          git push origin HEAD:rfc-031-voice-upload-limit
