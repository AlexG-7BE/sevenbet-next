name: RFC031 one-time browser test patch

on:
  push:
    branches:
      - rfc-031-voice-upload-limit

permissions:
  contents: write

jobs:
  patch-browser-test:
    if: contains(github.event.head_commit.message, '[apply-rfc031-browser-test]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rfc-031-voice-upload-limit
          fetch-depth: 0
      - name: Apply exact browser regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/program-ai-browser.spec.ts')
          text = path.read_text()
          replacements = [
              (
                  '    let failRecorder: (() => void) | null = null;\n    class FakeMediaRecorder {\n',
                  '    let failRecorder: (() => void) | null = null;\n    let recordingBytes = 3;\n    class FakeMediaRecorder {\n',
              ),
              (
                  '        this.ondataavailable?.({ data: new Blob([new Uint8Array([1, 2, 3])], { type: this.mimeType }) });\n',
                  '        this.ondataavailable?.({ data: new Blob([new Uint8Array(recordingBytes)], { type: this.mimeType }) });\n',
              ),
              (
                  '    Object.defineProperty(window, "__programAiFailRecorder", { value: () => failRecorder?.() });\n',
                  '    Object.defineProperty(window, "__programAiFailRecorder", { value: () => failRecorder?.() });\n    Object.defineProperty(window, "__programAiNextRecordingBytes", { value: (bytes: number) => { recordingBytes = bytes; } });\n',
              ),
              (
                  '  await expect(page.getByText("Type instead")).toBeVisible();\n\n  await page.getByRole("button", { name: "Start recording" }).click();\n  await page.clock.fastForward(90_000);\n',
                  '  await expect(page.getByText("Type instead")).toBeVisible();\n\n  await page.evaluate(() => (window as unknown as { __programAiNextRecordingBytes: (bytes: number) => void }).__programAiNextRecordingBytes(4_194_305));\n  await page.getByRole("button", { name: "Start recording" }).click();\n  await page.getByRole("button", { name: "Stop recording" }).click();\n  await expect(page.getByText(/recording is too large to upload/i)).toBeVisible();\n  await expect(page.getByRole("button", { name: "Retry this recording" })).toHaveCount(0);\n  expect(transcriptionCalls).toBe(1);\n  expect(await page.evaluate(() => (window as unknown as { __programAiStoppedTracks: number }).__programAiStoppedTracks)).toBe(3);\n  await page.getByRole("button", { name: "type instead" }).click();\n  await page.evaluate(() => (window as unknown as { __programAiNextRecordingBytes: (bytes: number) => void }).__programAiNextRecordingBytes(3));\n\n  await page.getByRole("button", { name: "Start recording" }).click();\n  await page.clock.fastForward(90_000);\n',
              ),
              (
                  '  expect(await page.evaluate(() => (window as unknown as { __programAiStoppedTracks: number }).__programAiStoppedTracks)).toBe(5);\n',
                  '  expect(await page.evaluate(() => (window as unknown as { __programAiStoppedTracks: number }).__programAiStoppedTracks)).toBe(6);\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact replacement precondition failed: expected 1 match, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff --check
          git diff -- tests/program-ai-browser.spec.ts
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/program-ai-browser.spec.ts
          git rm .github/workflows/rfc031-one-time-browser-test-patch.yml
          git commit -m "test: reject oversized Programme recording before network"
          git push origin HEAD:rfc-031-voice-upload-limit
