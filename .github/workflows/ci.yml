name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://sevenbet:sevenbet@127.0.0.1:54329/sevenbet_ci
  DIRECT_URL: postgresql://sevenbet:sevenbet@127.0.0.1:54329/sevenbet_ci
  BETTER_AUTH_SECRET: ci-only-better-auth-sentinel-do-not-use
  BETTER_AUTH_URL: http://127.0.0.1:4173
  BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:4173
  SEVENBET_ADMIN_PREVIEW_TOKEN: ci-only-admin-preview-sentinel-do-not-use
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4173
  PUBLIC_CASINO_CMS_ENABLED: "false"
  AFFILIATE_REDIRECT_ENGINE_ENABLED: "false"
  ALLOW_TEMPORARY_PRODUCTION_DEMO_CASINOS: "false"

jobs:
  agent-core:
    name: Agent Core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents
    env:
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agents/package-lock.json
      - run: npm ci
      - run: npm run check

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:quality
      - name: Run full Programme regression suite
        run: npm run programme:test

  build-browser:
    name: Build / Browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sevenbet
          POSTGRES_PASSWORD: sevenbet
          POSTGRES_DB: sevenbet_ci
        options: >-
          --health-cmd="pg_isready -U sevenbet -d sevenbet_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://sevenbet:sevenbet@postgres:5432/sevenbet_ci
      DIRECT_URL: postgresql://sevenbet:sevenbet@postgres:5432/sevenbet_ci
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Bridge disposable loopback database URLs to PostgreSQL service
        run: |
          nohup node -e '
            const net = require("node:net");
            for (const port of [5432, 54329]) {
              net.createServer((client) => {
                const upstream = net.createConnection({ host: "postgres", port: 5432 });
                client.on("error", () => upstream.destroy());
                upstream.on("error", () => client.destroy());
                client.pipe(upstream);
                upstream.pipe(client);
              }).listen(port, "127.0.0.1");
            }
          ' >/tmp/postgres-loopback-bridge.log 2>&1 &
          for port in 5432 54329; do
            attempt=0
            until node -e "const net = require('node:net'); const socket = net.createConnection({ host: '127.0.0.1', port: ${port} }, () => socket.end()); socket.on('error', () => process.exit(1));"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 50 ]; then
                echo "PostgreSQL loopback bridge failed on port ${port}" >&2
                exit 1
              fi
              sleep 0.1
            done
          done
      - run: npm ci
      - name: Run npm run ci:migrations
        env:
          DATABASE_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
          DIRECT_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
        run: npm run ci:migrations
      - name: Run npm run mvp-runtime:postgres-test
        env:
          DATABASE_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
          DIRECT_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
        run: npm run mvp-runtime:postgres-test
      - name: Run npm run mcp-bridge:postgres-test
        env:
          DATABASE_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
          DIRECT_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
        run: npm run mcp-bridge:postgres-test
      - run: npm run programme:seed
      - run: npm run build
      - run: npm run ci:build-secrets
      - run: npm run ci:browser
      - name: Verify Programme document Permissions-Policy boundary
        run: npx playwright test --config=playwright.program-ai.config.ts tests/programme-document-policy-boundary-browser.spec.ts
      - run: npm run typography:browser

  database-migrations:
    name: Database / Migration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sevenbet
          POSTGRES_PASSWORD: sevenbet
          POSTGRES_DB: sevenbet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sevenbet -d sevenbet_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
      DIRECT_URL: postgresql://sevenbet:sevenbet@127.0.0.1:5432/sevenbet_ci
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:migrations
      - run: npm run casino-market-release:postgres-test
      - run: npm run casino-market:postgres-test
      - run: npm run casino-ingest:postgres-test
      - run: npm run casino-population:postgres-test
      - run: npm run casino-population-release:postgres-test
      - run: npm run mvp-runtime:postgres-test
      - run: npm run mcp-bridge:postgres-test
