name: Launch Click Check

# One real click on every casino's public /r/ route from a Globalping probe in each launch market,
# judged against the licence register (RFC-054). Twice a day: 08:15 UTC, when Germany is closed,
# and 20:15 UTC, inside the German 21:00–06:00 window. The redirect is never followed, and the
# clicks are stored as BOT traffic. See docs/06_Operations/Launch-2026-09-28-Checklist.md.
on:
  schedule:
    - cron: "15 8 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch:

concurrency:
  group: launch-click-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  launch-markets:
    name: GB, SE, DK and DE clicks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ALERT_TITLE: "[Production] Launch click check alert"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Click every route from every launch market
        id: check
        shell: bash
        run: |
          set +e
          npm run --silent launch:click-check > click-check.md 2> click-check.log
          echo "status=$?" >> "${GITHUB_OUTPUT}"
          set -e
          cat click-check.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Open or update the alert on a violation
        if: steps.check.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "The launch click check found a closed market reaching a partner, or an unexpected response."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            grep -E '^\| (Market|---)|VIOLATION|UNEXPECTED' click-check.md || true
          } > alert.md
          number="$(gh issue list --state open --search "${ALERT_TITLE} in:title" --json number,title --jq "[.[] | select(.title == \"${ALERT_TITLE}\")][0].number // empty")"
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --body-file alert.md
          else
            gh issue create --title "${ALERT_TITLE}" --body-file alert.md
          fi
