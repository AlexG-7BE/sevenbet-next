  <text x="120" y="170" fill="#e4e24e" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="7">FICTIONAL MEDIA FIXTURE</text>
  <text x="120" y="430" fill="#f8f7ef" font-family="Arial,sans-serif" font-size="132" font-weight="900">WIDE</text><text x="120" y="540" fill="#f8f7ef" font-family="Arial,sans-serif" font-size="80" font-weight="700">16:9</text>
