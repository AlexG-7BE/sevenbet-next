name: Production screenshots (pause landing)

# Pictures of the pause landing pages on Production, taken from a GitHub-hosted runner because
# Production answers the Founder's machine with 451. Manual only: Actions → Production
# screenshots (pause landing) → Run workflow. Nothing is written to the repo: the pictures, REPORT.md
# and report.json are a workflow artifact for 14 days, and the report is shown in the run summary.
# Script: scripts/research/production-screenshots.mjs.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Site to photograph
        required: true
        default: https://b4gamble.com
      locales:
        description: Comma-separated language prefixes
        required: true
        default: sv,da

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies without build scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Photograph the pause landing pages
        run: node scripts/research/production-screenshots.mjs --base=${{ inputs.base }} --locales=${{ inputs.locales }} --out=screenshots
      - name: Show the report
        if: always()
        run: if [ -s screenshots/REPORT.md ]; then cat screenshots/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pause-landing-screenshots
          path: screenshots/
          retention-days: 14
