<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fictional wide media ratio fixture</title>
  <desc id="desc">A non-promotional abstract 16 by 9 fixture with visible edge markers.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a3a"/><stop offset="1" stop-color="#071516"/></linearGradient><radialGradient id="orb"><stop stop-color="#e4e24e"/><stop offset="1" stop-color="#9e9c16"/></radialGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1240" cy="450" r="300" fill="url(#orb)" opacity=".92"/><circle cx="1240" cy="450" r="205" fill="#071516" opacity=".82"/>
